# Documentation-drift audit.
#
# An agent (headless opencode against the internal SKAINET gateway, same
# default model as the rest of the harness suite) reads the whole checkout and
# reports where the documentation makes a concrete factual claim the code
# contradicts — a removed flag, a changed default, a renamed command, a moved
# path, a behaviour that no longer holds. Every finding is verified against the
# actual code (both sides quoted) before it is reported, to keep false
# positives down.
#
# Two jobs share one script (scripts/doc-drift.sh, selected by DRIFT_MODE):
#   docs-drift     — README/AGENTS/docs prose vs code
#   comments-drift — inline comments and docstrings vs code
#
# Advisory only: manual dispatch + weekly schedule. Never gates a merge — the
# deliverable is the report (step summary + uploaded artifact).
name: "Doc drift"

on:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'Pinned opencode package spec for the driving agent (THIS RUN ONLY)'
        type: string
        default: 'opencode-ai@1.17.12'
      timeout_secs:
        description: 'Wall-clock timeout for the audit agent, in seconds'
        type: string
        default: '2400'
      model:
        description: 'Model id for the audit agent, for THIS RUN ONLY. Set empty to use each harness''s pin in internal/e2e/versions.go (opencode/codex/copilot/pi/codewhale: zai-org/GLM-5.2, claude-code: claude-sonnet-5).'
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Flash'
      context_limit:
        description: 'Context window declared to the agent, in tokens. Leave empty for the 100000 default, which is safely under every pinned model'
        type: string
        default: ''
  schedule:
    # Mondays 06:00 UTC — weekly drift sweep.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # Front-loads model selection: the gateway serves one name variant at a time
  # and flips without notice (#184). Probing once here means a renamed model
  # fails in seconds rather than after a 40-minute audit.
  model:
    name: Resolve model
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.probe.outputs.model }}
      fallback: ${{ steps.probe.outputs.fallback }}
      candidates: ${{ steps.probe.outputs.candidates }}
    env:
      SKAINET_TOKEN: ${{ secrets.SKAINET_TOKEN }}
      SKAINET_INTERNAL: ${{ secrets.SKAINET_INTERNAL }}
      E2E_MODEL: ${{ github.event.inputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe the gateway
        id: probe
        run: scripts/probe-model.sh opencode --github-output
      - name: Report the selection
        run: |
          {
            echo "## Model selection"
            echo ""
            echo "Model: \`${{ steps.probe.outputs.model }}\` · probed: \`${{ steps.probe.outputs.candidates }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.probe.outputs.fallback }}' = 'true' ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ **Fallback model in use** — the intended model is not served by the gateway." >> "$GITHUB_STEP_SUMMARY"
          fi

  drift:
    name: ${{ matrix.mode }} drift
    needs: model
    strategy:
      fail-fast: false
      matrix:
        mode: [docs, comments]
    runs-on: ubuntu-latest
    concurrency:
      group: doc-drift-${{ matrix.mode }}
      cancel-in-progress: false
    env:
      DRIFT_MODE: ${{ matrix.mode }}
      SKAINET_TOKEN: ${{ secrets.SKAINET_TOKEN }}
      SKAINET_INTERNAL: ${{ secrets.SKAINET_INTERNAL }}
      E2E_VERSION_OPENCODE: ${{ github.event.inputs.opencode_version }}
      DRIFT_TIMEOUT_SECS: ${{ github.event.inputs.timeout_secs }}
      # From the preflight job: the input, the gateway probe and the -TEE flip
      # already applied. Only opencode is involved here, so the cross-harness
      # var is the right one to set.
      E2E_MODEL: ${{ needs.model.outputs.gateway }}
      E2E_CONTEXT_LIMIT: ${{ github.event.inputs.context_limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run doc-drift audit
        id: run_drift
        env:
          DRIFT_LOG_DIR: ${{ runner.temp }}/doc-drift-logs
        run: scripts/doc-drift.sh

      - name: Report summary
        if: always()
        run: |
          {
            echo "## Doc drift — ${{ matrix.mode }}"
            echo ""
            echo "Model: \`${{ needs.model.outputs.gateway }}\`"
            echo ""
            echo '```markdown'
            cat "${{ runner.temp }}/doc-drift-logs/DRIFT_REPORT-${{ matrix.mode }}.md" 2>/dev/null \
              || echo "(no report file produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-drift-${{ matrix.mode }}
          path: ${{ runner.temp }}/doc-drift-logs/
          if-no-files-found: ignore
          retention-days: 14
