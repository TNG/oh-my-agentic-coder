# Continuous integration: build and test the project on every push and PR.
#
# Runs on Linux and macOS so that platform-specific code paths (keychain,
# unix-domain socket facade, sandbox launchers) are exercised.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 AppArmor restricts unprivileged user namespaces.
          # Grant bwrap the userns permission so it can create sandboxes.
          # Without this, every internal/sandboxrun integration test that
          # launches a real bwrap sandbox silently skips via requireBwrap,
          # instead of actually exercising the sandbox it claims to test.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module tidy
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -count=1 -timeout=5m ./...

  wsl2-session:
    # WSL2-style degraded session. WSL2 distros commonly run without systemd
    # (needs systemd=true in wsl.conf), and even with it, `Linger=no` makes
    # systemd tear down /run/user/<uid> — including the session-bus socket —
    # when the login session ends, while DBUS_SESSION_BUS_ADDRESS still points
    # at the now-dead socket. This job reproduces that failure mode
    # deterministically on a plain Ubuntu runner: point the bus address at a
    # socket that doesn't exist and confirm omac's keychain/Secret Service reads
    # degrade gracefully (keychain.IsUnavailable) instead of surfacing raw dial
    # errors. For a full WSL2 run see the wsl2 job below.
    name: WSL2-style session (dead bus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # This job degrades the session, not the sandbox, so bwrap still
          # needs the unprivileged-userns permission AppArmor denies by default
          # on Ubuntu 24.04 — otherwise the sandbox integration tests would
          # skip rather than run under the degraded session.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test under a torn-down session bus
        env:
          # A /run/user/<uid>/bus that systemd already removed: the address is
          # still exported, but the socket is gone (Linger=no teardown).
          DBUS_SESSION_BUS_ADDRESS: unix:path=${{ runner.temp }}/dead-user-bus
          # The runtime dir was never created — mimics a session with no
          # systemd --user instance to populate it.
          XDG_RUNTIME_DIR: ${{ runner.temp }}/nonexistent-run-user
        run: go test -race -count=1 -timeout=5m ./...

  wsl2:
    # Full test suite on real WSL2: catches WSL-specific osinfo detection,
    # sandbox-under-Microsoft-kernel, and keychain degraded-session paths.
    # Ubuntu 24.04 needs no AppArmor userns fix (WSL2's kernel doesn't
    # enforce it). continue-on-error during rollout, remove after
    # consistently successful
    name: Test (WSL2 - Ubuntu 24.04)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip CRLF from shell and TypeScript files
        # actions/checkout defaults to core.autocrlf=true on Windows, which
        # converts LF->CRLF. CRLF breaks bash scripts inside WSL (e.g.
        # `set -euo pipefail\r` → exit 2) and can cause issues with TypeScript
        # tooling. Strip \r from .sh and .ts files so WSL sees clean LF.
        shell: bash
        run: find . \( -name '*.sh' -o -name '*.ts' \) -not -path './.git/*' -exec sed -i 's/\r$//' {} +

      - name: Set up WSL2 (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: bubblewrap gcc libc6-dev
          # update: 'true'  # makes it very slow

      - name: Set up Go in WSL2
        shell: wsl-bash {0}
        run: |
          GO_VERSION=$(grep '^go ' go.mod | tr -d '\r' | awk '{print $2}')
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | sudo tar -C /usr/local -xz

      - name: Verify module tidy
        shell: wsl-bash {0}
        run: /usr/local/go/bin/go mod download && /usr/local/go/bin/go mod verify

      - name: go vet
        shell: wsl-bash {0}
        run: /usr/local/go/bin/go vet ./...

      - name: Build
        shell: wsl-bash {0}
        run: /usr/local/go/bin/go build -v ./...

      - name: Test
        shell: wsl-bash {0}
        run: /usr/local/go/bin/go test -race -count=1 -timeout=10m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      # Workflow `run:` bodies are shell that nothing else parses, so a quoting
      # mistake ships and only surfaces the next time that job runs — days
      # later for the weekly LLM workflows.
      - name: Workflow shell syntax
        run: python3 scripts/check-workflow-shell.py

      - name: Release notification policy
        run: python3 scripts/release-workflow_test.py

      # Keeps README.md an entry point (line cap) and the docs/ split honest
      # (every relative link + anchor resolves). See issue #190.
      - name: Doc guardrails
        run: python3 scripts/check-docs.py

  e2e-fast:
    # Model-free slice of the e2e suite (build tag `e2e_fast`): the security
    # regression tests that need no live LLM harness, API token, or OS
    # sandbox — dir_token isolation driven over real loopback sockets, the
    # mutation-tested assertion predicates, the --no-sandbox exposure report,
    # and the harness/version registry invariants. The full "E2E: full" suite
    # (e2e.yml, live models) still runs weekly; this gate keeps these regressions
    # off the merge path instead of surfacing them up to a week later. No
    # bubblewrap: `omac serve --no-inner` exercises the control plane only.
    name: "E2E: model-free (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run model-free e2e tests
        run: go test -tags=e2e_fast -race -count=1 -timeout=5m ./internal/e2e/

      # The shell counterpart of the model-resolution invariants the Go tests
      # above cover: scripts/resolve-model.sh feeds the workflows' shell steps
      # and must agree with modelID()/validateModel(), or a run reports a model
      # it didn't use.
      - name: Check model resolver parity
        run: scripts/resolve-model_test.sh

      # The gateway-probe paths (variant flip, tier priority, fallback,
      # exhausted candidates) against a local stub gateway — the states that
      # can't be produced on demand upstream. No credentials, no real network.
      - name: Check model probe against a stub gateway
        run: scripts/probe-model_test.sh

  cache-integration:
    name: Cache integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-pip
          printf '%s\n' \
            'abi <abi/4.0>,' \
            '/usr/bin/bwrap flags=(unconfined) {' \
            '  userns,' \
            '}' \
            | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / -- /bin/true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: go test -count=1 -run '^TestIntegration.*Cache' ./internal/sandboxrun
      - run: go test -tags=e2e -count=1 -timeout=15m -run '^TestE2ECache' ./internal/e2e/

  external-tooling:
    # Proves proxy-unaware / proxy-aware external toolchains actually reach
    # the network through the omac filtering proxy under a filtered bwrap
    # sandbox (build tag `external_tools`): curl (honors HTTP(S)_PROXY),
    # Node's native fetch via the `node` proxy_injection family
    # (NODE_USE_ENV_PROXY, Node >= 24), and the JVM via the `jvm`
    # proxy_injection family (JAVA_TOOL_OPTIONS, any modern JDK). Split out
    # from the main test job because it needs a real tool matrix (bubblewrap
    # + Landlock ABI >= 4 + curl + Node 24 + JDK) that the hermetic unit
    # tests don't; keeping it separate keeps `go test ./...` free of that
    # runtime dependency. Linux-only: the kernel proxy/Landlock path is
    # Linux-specific.
    name: "External tooling (proxy egress)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 AppArmor restricts unprivileged user namespaces;
          # grant bwrap the userns permission (see the test job above) so the
          # sandbox launches instead of silently skipping via requireBwrap.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The jvm proxy_injection family test compiles a small Java probe with
      # javac and runs it with java inside the sandbox. Temurin is the default
      # JDK on ubuntu-latest via setup-java; javac is bundled in the JDK.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The lint job runs staticcheck without build tags, so it never sees
      # the external_tools files. Vet them here or they go unanalysed.
      - name: Vet tagged sources
        run: go vet -tags=external_tools ./internal/sandboxrun/

      - name: Run external-tooling proxy tests
        run: go test -tags=external_tools -count=1 -timeout=10m ./internal/sandboxrun/
