# E2E: README onboarding completeness test.
#
# Independent of the E2E harness×skill matrix (e2e.yml), which hands each
# harness a fixed script inside an already-configured omac sandbox. This
# workflow hands a single opencode-driven agent NOTHING but the checked-out
# README.md — no other repo file — and asks it to self-serve a normal omac
# dev setup exactly as a brand-new developer would, then report back on
# every gap, ambiguity, or wrong instruction it hit along the way.
#
# Manual trigger only — this is a documentation-completeness audit, not a
# regression gate, and involves a longer, more open-ended agent session
# (real package installs, retries) than the scripted matrix suite.
name: "E2E: onboarding"

on:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'Pinned opencode package spec for the driving agent. Overrides scripts/e2e-readme-onboarding.sh''s default for THIS RUN ONLY'
        type: string
        default: 'opencode-ai@1.17.12'
      timeout_secs:
        description: 'Wall-clock timeout for the onboarding agent session, in seconds'
        type: string
        default: '1200'
      model:
        description: 'Model id for the onboarding agent, for THIS RUN ONLY. Set empty to use each harness''s pin in internal/e2e/versions.go (opencode/codex/copilot/pi/codewhale: zai-org/GLM-5.2, claude-code: claude-sonnet-5).'
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Flash'
      context_limit:
        description: 'Context window declared to the agent, in tokens. Leave empty for the 100000 default, which is safely under every pinned model'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Front-loads model selection: the gateway serves one name variant at a time
  # and flips without notice (#184). Probing once here means a renamed model
  # fails in seconds rather than after a 20-minute agent session.
  model:
    name: Resolve model
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.probe.outputs.model }}
      fallback: ${{ steps.probe.outputs.fallback }}
      candidates: ${{ steps.probe.outputs.candidates }}
    env:
      SKAINET_TOKEN: ${{ secrets.SKAINET_TOKEN }}
      SKAINET_INTERNAL: ${{ secrets.SKAINET_INTERNAL }}
      E2E_MODEL: ${{ github.event.inputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe the gateway
        id: probe
        run: scripts/probe-model.sh opencode --github-output
      - name: Report the selection
        run: |
          {
            echo "## Model selection"
            echo ""
            echo "Model: \`${{ steps.probe.outputs.model }}\` · probed: \`${{ steps.probe.outputs.candidates }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.probe.outputs.fallback }}' = 'true' ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ **Fallback model in use** — the intended model is not served by the gateway." >> "$GITHUB_STEP_SUMMARY"
          fi

  readme-onboarding:
    name: README onboarding (${{ matrix.os }})
    needs: model
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: e2e-readme-onboarding-${{ matrix.os }}
      cancel-in-progress: false
    env:
      SKAINET_TOKEN: ${{ secrets.SKAINET_TOKEN }}
      SKAINET_INTERNAL: ${{ secrets.SKAINET_INTERNAL }}
      E2E_VERSION_OPENCODE: ${{ github.event.inputs.opencode_version }}
      E2E_ONBOARDING_TIMEOUT_SECS: ${{ github.event.inputs.timeout_secs }}
      # From the preflight job: the input, the gateway probe and the -TEE flip
      # already applied. Only opencode is involved here, so the cross-harness
      # var is the right one to set.
      E2E_MODEL: ${{ needs.model.outputs.gateway }}
      E2E_CONTEXT_LIMIT: ${{ github.event.inputs.context_limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run README onboarding test
        id: run_onboarding
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-readme-logs
        run: scripts/e2e-readme-onboarding.sh

      - name: Report summary
        if: always()
        run: |
          echo "## README onboarding (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Model: \`${{ needs.model.outputs.gateway }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.run_onboarding.outcome }}" = "success" ]; then
            echo "**Result:** README was sufficient — doctor healthy, report written." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result:** gaps blocked a clean setup, or the agent didn't finish — see the report below." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```markdown' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ runner.temp }}/e2e-readme-logs/ONBOARDING_REPORT.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no report file produced)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-readme-onboarding-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-readme-logs/
          if-no-files-found: ignore
          retention-days: 14
