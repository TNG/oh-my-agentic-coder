# E2E: full harness×skill lifecycle tests.
#
# Runs on manual trigger and every Saturday at 10:00 CET (08:00 UTC in
# summer / 09:00 UTC in winter). Tests that each harness can start under
# the omac sandbox and that an agent running on the selected model (or
# claude-sonnet-5 for claude-code) can call the bundled echo-rest skill
# through the omac facade.
name: "E2E: full"

on:
  workflow_dispatch:
    inputs:
      skip_claude_code:
        description: 'Skip claude-code (the only harness billed against the real Anthropic account)'
        type: boolean
        default: false
      use_latest:
        description: 'Install each harness''s latest release for THIS RUN ONLY instead of internal/e2e/versions.go''s pin (drift-detection run; the *_version inputs below are ignored when checked)'
        type: boolean
        default: false
      opencode_version:
        description: 'Pinned opencode package spec. Overrides internal/e2e/versions.go for THIS RUN ONLY (the file itself is untouched); ignored if "use latest" is checked'
        type: string
        default: 'opencode-ai@1.17.12'
      claude_code_version:
        description: 'Pinned claude-code package spec. Overrides internal/e2e/versions.go for THIS RUN ONLY (the file itself is untouched); ignored if "use latest" is checked'
        type: string
        default: '@anthropic-ai/claude-code@2.1.197'
      codex_version:
        description: 'Pinned codex package spec. Overrides internal/e2e/versions.go for THIS RUN ONLY (the file itself is untouched); ignored if "use latest" is checked'
        type: string
        default: '@openai/codex@0.142.5'
      copilot_version:
        description: 'Pinned copilot package spec. Overrides internal/e2e/versions.go for THIS RUN ONLY (the file itself is untouched); ignored if "use latest" is checked'
        type: string
        default: '@github/copilot@1.0.68'
      pi_version:
        description: 'Pinned pi package spec. Overrides internal/e2e/versions.go for THIS RUN ONLY (the file itself is untouched); ignored if "use latest" is checked'
        type: string
        default: '@earendil-works/pi-coding-agent@0.80.6'
      codewhale_version:
        description: 'Pinned codewhale package spec. Overrides internal/e2e/versions.go for THIS RUN ONLY (the file itself is untouched); ignored if "use latest" is checked'
        type: string
        default: 'codewhale@0.9.1'
      model:
        description: 'Model id for EVERY harness, for THIS RUN ONLY. Set empty to use each harness''s pin in internal/e2e/versions.go (opencode/codex/copilot/pi/codewhale: zai-org/GLM-5.2, claude-code: claude-sonnet-5). As of 2026-08-25 the SKAINET-EXTERNAL is phased out, so defaults to a small internal model.'
        type: string
        default: 'deepseek-ai/DeepSeek-V4-Flash'
      claude_code_model:
        description: 'Model id for claude-code only — it accepts sonnet or haiku models ONLY, and bills a different provider than the SKAINET gateway the others use. Wins over "model"; leave empty to fall back to it, then to the versions.go pin'
        type: string
        default: ''
      # No `context_limit` input here: with six harnesses pinned this workflow
      # sits at GitHub's 10-input cap. Set E2E_CONTEXT_LIMIT locally instead, or
      # use the "E2E: drift" workflow, which still exposes the input.
  schedule:
    - cron: '0 8 * * 6' # Saturdays 10:00 CEST

permissions:
  contents: read

jobs:
  # Front-loads model selection so a renamed or withdrawn model costs seconds
  # instead of a whole matrix. The gateway serves one name variant at a time and
  # flips without notice (#184); scripts/probe-model.sh asks GET /models what is
  # advertised, then settles it with a 1-token chat probe, flipping the -TEE
  # suffix and finally falling back to another family if it must.
  model:
    name: Resolve model
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.probe.outputs.model }}
      fallback: ${{ steps.probe.outputs.fallback }}
      candidates: ${{ steps.probe.outputs.candidates }}
      claude_code: ${{ steps.probe.outputs.claude_code }}
    env:
      SKAINET_TOKEN: ${{ secrets.SKAINET_TOKEN }}
      SKAINET_INTERNAL: ${{ secrets.SKAINET_INTERNAL }}
      E2E_MODEL: ${{ github.event.inputs.model }}
      E2E_MODEL_CLAUDE_CODE: ${{ github.event.inputs.claude_code_model }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe the gateway
        id: probe
        run: |
          # The gateway harnesses (opencode/codex/copilot/pi/codewhale) share
          # one model, so one probe covers all five.
          scripts/probe-model.sh opencode --github-output
          # claude-code is resolved but never probed: it talks to
          # ANTHROPIC_BASE_URL, not this gateway. Its own input wins; failing
          # here (rather than in the matrix) keeps an unlaunchable model from
          # burning an install first.
          cc=$(E2E_MODEL= scripts/probe-model.sh claude-code)
          echo "claude_code=$cc" >> "$GITHUB_OUTPUT"

      - name: Report the selection
        run: |
          gateway='${{ steps.probe.outputs.model }}'
          {
            echo "## Model selection"
            echo ""
            echo "| Harness | Model |"
            echo "|---|---|"
            echo "| opencode, codex, copilot, pi, codewhale | \`$gateway\` |"
            echo "| claude-code | \`${{ steps.probe.outputs.claude_code }}\` |"
            echo ""
            echo "Probed: \`${{ steps.probe.outputs.candidates }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.probe.outputs.fallback }}' = 'true' ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ **Fallback model in use.** The intended model is not served by the gateway, so these results are for \`$gateway\` and do NOT certify the intended one." >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: "${{ matrix.harness }} / ${{ matrix.os }}"
    needs: model
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        harness: [opencode, claude-code, codex, copilot, pi, codewhale]
        # codex on macOS is excluded — its Rust HTTP client is incompatible
        # with the macOS Seatbelt sandbox (stream disconnected mid-completion,
        # even with network=open). `omac start codex` on macOS fails loud;
        # --no-sandbox would disable the entire omac sandbox, leaving nothing
        # to assert against. See issue #48.
        #
        # codewhale on macOS is excluded by analogy: it too is a Rust CLI with
        # its own HTTP client (the codex failure class). This is precautionary
        # and UNVERIFIED for codewhale — re-test on macOS and drop this exclude
        # (and the matching ones in internal/e2e) if it works.
        exclude:
          - os: macos-latest
            harness: codex
          - os: macos-latest
            harness: codewhale
    runs-on: ${{ matrix.os }}
    concurrency:
      group: e2e-${{ matrix.os }}-${{ matrix.harness }}
      cancel-in-progress: false
    env:
      SKAINET_TOKEN: ${{ secrets.SKAINET_TOKEN }}
      SKAINET_INTERNAL: ${{ secrets.SKAINET_INTERNAL }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      E2E_HARNESS: ${{ matrix.harness }}
      # Drift-detection: install latest instead of the pinned versions below.
      # Empty (falsy) on schedule runs and on any workflow_dispatch where the
      # box isn't checked — versions.go then falls back to its pinned map.
      E2E_USE_LATEST: ${{ github.event.inputs.use_latest == 'true' && '1' || '' }}
      # Per-harness pinned-version overrides for a manual run, so a version
      # can be bumped/tested without editing internal/e2e/versions.go. Empty
      # on schedule runs; versions.go falls back to its pinned map when unset.
      # Ignored entirely when E2E_USE_LATEST is set.
      E2E_VERSION_OPENCODE: ${{ github.event.inputs.opencode_version }}
      E2E_VERSION_CLAUDE_CODE: ${{ github.event.inputs.claude_code_version }}
      E2E_VERSION_CODEX: ${{ github.event.inputs.codex_version }}
      E2E_VERSION_COPILOT: ${{ github.event.inputs.copilot_version }}
      E2E_VERSION_PI: ${{ github.event.inputs.pi_version }}
      E2E_VERSION_CODEWHALE: ${{ github.event.inputs.codewhale_version }}
      # Models come from the preflight job, which already applied the `model`
      # input, the gateway probe, and the -TEE variant flip. Set PER HARNESS
      # rather than via cross-harness E2E_MODEL: the probed value is a gateway
      # model, and handing it to claude-code — which is on another provider and
      # launches sonnet/haiku only — would fail its legs on every run,
      # scheduled ones included.
      E2E_MODEL_OPENCODE: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_CODEX: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_COPILOT: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_PI: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_CODEWHALE: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_CLAUDE_CODE: ${{ needs.model.outputs.claude_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Selection happened in the preflight job; this only resolves what this
      # leg's harness ended up with (per-harness env, set above) and reports it.
      - name: Resolve model
        id: model
        run: |
          model=$(scripts/resolve-model.sh '${{ matrix.harness }}')
          # Reported as the label rather than the number so the default has one
          # definition (contextLimit() in internal/e2e/versions.go).
          context="${E2E_CONTEXT_LIMIT:-versions.go default}"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "::notice title=Model::${{ matrix.harness }} runs against $model (context: $context)"

      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 AppArmor restricts unprivileged user namespaces.
          # Grant bwrap the userns permission so it can create sandboxes.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm/bun package downloads are a leading cause of e2e infra flakiness
      # (registry throttling, transient network errors). Cache them keyed on
      # the pinned harness versions so a version bump invalidates the cache
      # but repeated runs at the same versions reuse already-fetched packages.
      # The use_latest/*_version inputs are folded in too, so a manual
      # drift-detection or version-override run never reuses a cache keyed
      # for the versions.go-pinned versions (or vice versa).
      - name: Cache harness install packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/e2e-install-cache
          key: e2e-install-${{ runner.os }}-${{ matrix.harness }}-${{ hashFiles('internal/e2e/versions.go') }}-${{ github.event.inputs.use_latest }}-${{ github.event.inputs.opencode_version }}-${{ github.event.inputs.claude_code_version }}-${{ github.event.inputs.codex_version }}-${{ github.event.inputs.copilot_version }}-${{ github.event.inputs.pi_version }}
          restore-keys: |
            e2e-install-${{ runner.os }}-${{ matrix.harness }}-

      # The e2e_fast subset is network-free and agent-free, so every failure in
      # it is deterministic and no amount of retrying can clear one. Gate on it
      # here — under this job's resolved E2E_MODEL_*/E2E_VERSION_* env, which
      # the PR-level e2e_fast run does not set — so an assertion that only
      # breaks against the probed model fails in seconds and is named as a test
      # defect, instead of burning three attempts and reporting as infra.
      - name: Deterministic test gate
        if: matrix.harness != 'claude-code' || github.event.inputs.skip_claude_code != 'true'
        run: |
          set -o pipefail
          if ! go test -tags=e2e_fast -count=1 ./internal/e2e/ 2>&1 | tee /tmp/e2e-fast.txt; then
            echo "::error::deterministic (e2e_fast) test failure — a test defect, not infra; retries cannot clear it"
            {
              echo "## E2E deterministic gate FAILED (${{ matrix.harness }} / ${{ matrix.os }})"
              echo ""
              echo "Network-free tests failed against the resolved model/version env."
              echo "This is a test defect, not infra — the agent legs were not run."
              echo ""
              echo '```'
              grep -E '^( *--- FAIL|.*_test\.go:)' /tmp/e2e-fast.txt | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run e2e test
        id: run_e2e
        # claude-code is the only harness billed against a real external
        # Anthropic account (the others run against the internal SKAINET
        # gateway) — included by default, skippable via the workflow_dispatch
        # input above. The scheduled run always includes it. (job-level `if:`
        # can't reference `matrix` — only `github`/`inputs`/`needs`/`vars` are
        # available there — so the guard lives on this step instead.)
        if: matrix.harness != 'claude-code' || github.event.inputs.skip_claude_code != 'true'
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          E2E_CACHE_DIR: ${{ runner.temp }}/e2e-install-cache
        run: |
          set -o pipefail
          max_attempts=3
          attempt=1
          while :; do
            echo "::group::e2e attempt $attempt/$max_attempts"
            if go test -tags=e2e -timeout=30m -v ./internal/e2e/ 2>&1 | tee /tmp/e2e-out.txt; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            # A go-test deadline is a test/product defect (a deadlocked or
            # runaway test), never infra: the model provider cannot make a test
            # hang for 30 minutes, and retrying costs another full deadline per
            # attempt. Bail immediately and name the test that was still
            # running, so the signal is not buried under "infra-only". See #222.
            if grep -q '^panic: test timed out after' /tmp/e2e-out.txt; then
              # The panic header through the blank line = the "running tests:"
              # list, i.e. exactly what hung, without the goroutine dump.
              hung=$(sed -n '/^panic: test timed out after/,/^$/p' /tmp/e2e-out.txt | head -20)
              echo "::error::go test hit its deadline — a hung test, not infra; retries cannot clear it"
              echo "test(s) still running at the deadline:"
              echo "$hung"
              {
                echo "## E2E deadline exceeded (${{ matrix.harness }} / ${{ matrix.os }})"
                echo '```'
                echo "$hung"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            # Only retry when no failure this attempt was classified as a real
            # regression: SANDBOX_FAIL (a security property went unenforced)
            # or AGENT_REFUSED/AGENT_PARTIAL (a model-behavior signal, not
            # infra). Every other failure path — install/build errors,
            # AGENT_NEVER_RAN, INFRA_ERROR, agent timeout — is either a
            # t.Fatalf before any assertion ran, or an infra-classified
            # assertion, and is safe to retry. This ensures a real sandbox
            # regression can never be silently masked by a retry.
            bad=$(grep -oE 'FAIL \[[^]]+\]: (SANDBOX_FAIL|AGENT_REFUSED|AGENT_PARTIAL)' /tmp/e2e-out.txt | sort -u || true)
            if [ -n "$bad" ]; then
              echo "non-infra failure — not retrying:"
              echo "$bad"
              exit 1
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "max attempts ($max_attempts) reached — giving up"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "infra-only failure — retrying in 15s (attempt $attempt/$max_attempts)"
            sleep 15
          done

      - name: Skipped notice
        if: steps.run_e2e.outcome == 'skipped'
        run: |
          echo "## E2E (${{ matrix.harness }} / ${{ matrix.os }}): SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          echo "skip_claude_code was set on this workflow_dispatch run (model would have been \`${{ steps.model.outputs.model }}\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Failure classification summary
        if: always() && steps.run_e2e.outcome != 'skipped'
        run: |
          # Render a markdown table on the run-summary page so the failure
          # cause is visible by indicator without opening the full log.
          echo "## E2E failure classification (${{ matrix.harness }} / ${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Model: \`${{ steps.model.outputs.model }}\` · context: \`${{ steps.model.outputs.context }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ needs.model.outputs.fallback }}' = 'true' ] && [ '${{ matrix.harness }}' != 'claude-code' ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ Fallback model — the intended model is not served by the gateway, so this result does NOT certify it." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assertion | Mode | Reason |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'FAIL \[[^]]+\]: [A-Z_]+ — ' /tmp/e2e-out.txt; then
            grep -oE 'FAIL \[[^]]+\]: [A-Z_]+ — [^\\]*' /tmp/e2e-out.txt \
              | sort -u \
              | sed -E 's/FAIL \[([^]]+)\]: ([A-Z_]+) — (.*)/| `\1` | `\2` | \3 |/' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| _all passed_ | PASS | no failures |" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Also echo to stdout so the table is visible in the raw log too.
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.harness }}-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore
          retention-days: 14

  e2e-wsl2:
    # Full e2e suite on real WSL2. All 6 harnesses run (WSL2 is GOOS=linux,
    # so codex/codewhale are NOT excluded). Go/bun/node are installed manually
    # inside WSL — the setup-* actions install on the Windows side, not in
    # WSL. The wsl-bash shell uses --noprofile --norc, so PATH and GITHUB_*
    # path translation are set up in /tmp/wsl-env.sh and sourced per step.
    # Cache and logs use relative paths (relative to the checkout) so they
    # work from both the Windows runner (actions/cache, upload-artifact) and
    # inside WSL (Go test code) via the automount. continue-on-error during
    # rollout.
    name: "${{ matrix.harness }} / WSL2"
    needs: model
    strategy:
      fail-fast: false
      matrix:
        harness: [opencode, claude-code, codex, copilot, pi, codewhale]
    runs-on: windows-latest
    continue-on-error: true
    concurrency:
      group: e2e-wsl2-${{ matrix.harness }}
      cancel-in-progress: false
    env:
      SKAINET_TOKEN: ${{ secrets.SKAINET_TOKEN }}
      SKAINET_INTERNAL: ${{ secrets.SKAINET_INTERNAL }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      E2E_HARNESS: ${{ matrix.harness }}
      E2E_USE_LATEST: ${{ github.event.inputs.use_latest == 'true' && '1' || '' }}
      E2E_VERSION_OPENCODE: ${{ github.event.inputs.opencode_version }}
      E2E_VERSION_CLAUDE_CODE: ${{ github.event.inputs.claude_code_version }}
      E2E_VERSION_CODEX: ${{ github.event.inputs.codex_version }}
      E2E_VERSION_COPILOT: ${{ github.event.inputs.copilot_version }}
      E2E_VERSION_PI: ${{ github.event.inputs.pi_version }}
      E2E_VERSION_CODEWHALE: ${{ github.event.inputs.codewhale_version }}
      E2E_MODEL_OPENCODE: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_CODEX: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_COPILOT: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_PI: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_CODEWHALE: ${{ needs.model.outputs.gateway }}
      E2E_MODEL_CLAUDE_CODE: ${{ needs.model.outputs.claude_code }}
      # WSL only forwards vars listed in WSLENV — include every job/step env
      # var the Go tests read via os.Getenv(). Without it, SKAINET_TOKEN,
      # E2E_MODEL_*, etc. are unbound inside wsl-bash.
      WSLENV: GITHUB_OUTPUT:GITHUB_STEP_SUMMARY:SKAINET_TOKEN:SKAINET_INTERNAL:ANTHROPIC_BASE_URL:E2E_HARNESS:E2E_USE_LATEST:E2E_VERSION_OPENCODE:E2E_VERSION_CLAUDE_CODE:E2E_VERSION_CODEX:E2E_VERSION_COPILOT:E2E_VERSION_PI:E2E_VERSION_CODEWHALE:E2E_MODEL_OPENCODE:E2E_MODEL_CODEX:E2E_MODEL_COPILOT:E2E_MODEL_PI:E2E_MODEL_CODEWHALE:E2E_MODEL_CLAUDE_CODE:E2E_LOG_DIR:E2E_CACHE_DIR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip CRLF from shell and TypeScript files
        # actions/checkout defaults to core.autocrlf=true on Windows, which
        # converts LF->CRLF. CRLF breaks bash scripts inside WSL (e.g.
        # `set -euo pipefail\r` → exit 2) and can cause issues with TypeScript
        # tooling. Strip \r from .sh and .ts files so WSL sees clean LF.
        shell: bash
        run: find . \( -name '*.sh' -o -name '*.ts' \) -not -path './.git/*' -exec sed -i 's/\r$//' {} +

      - name: Set up WSL2 (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: bubblewrap gcc libc6-dev unzip python3-pip
          # Run wsl-bash steps as a non-root user so DAC protects root-owned
          # paths (/etc/shadow, /root/.bashrc) — matches Linux CI behavior.
          wsl-shell-user: runner
          # update: 'true'  # makes it very slow

      - name: Set up Go and Node in WSL2 (as root)
        shell: wsl-bash -u root {0}
        run: |
          GO_VERSION=$(grep '^go ' go.mod | tr -d '\r' | awk '{print $2}')
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs

      - name: Set up Bun and Rust in WSL2
        shell: wsl-bash {0}
        run: |
          curl -fsSL https://bun.sh/install | bash
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          # wsl-bash uses --noprofile --norc, so /etc/profile.d is not sourced.
          # Make Go, bun, and cargo available to subsequent steps, and translate
          # GitHub Actions file paths (Windows backslash paths) to WSL paths.
          cat > /tmp/wsl-env.sh <<'WEOF'
          export PATH="/usr/local/go/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            export GITHUB_OUTPUT=$(wslpath -u "$GITHUB_OUTPUT" 2>/dev/null || echo "$GITHUB_OUTPUT")
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            export GITHUB_STEP_SUMMARY=$(wslpath -u "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "$GITHUB_STEP_SUMMARY")
          fi
          if [ -n "${E2E_LOG_DIR:-}" ]; then
            export E2E_LOG_DIR=$(wslpath -u "$E2E_LOG_DIR" 2>/dev/null || echo "$E2E_LOG_DIR")
          fi
          if [ -n "${E2E_CACHE_DIR:-}" ]; then
            export E2E_CACHE_DIR=$(wslpath -u "$E2E_CACHE_DIR" 2>/dev/null || echo "$E2E_CACHE_DIR")
          fi
          WEOF

      - name: Verify module tidy
        shell: wsl-bash {0}
        run: |
          source /tmp/wsl-env.sh
          go mod download && go mod verify

      - name: Resolve model
        id: model
        shell: wsl-bash {0}
        run: |
          source /tmp/wsl-env.sh
          model=$(scripts/resolve-model.sh '${{ matrix.harness }}')
          context="${E2E_CONTEXT_LIMIT:-versions.go default}"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "::notice title=Model::${{ matrix.harness }} runs against $model (context: $context)"

      - name: Cache harness install packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/e2e-install-cache
          key: e2e-install-Windows-${{ matrix.harness }}-${{ hashFiles('internal/e2e/versions.go') }}-${{ github.event.inputs.use_latest }}-${{ github.event.inputs.opencode_version }}-${{ github.event.inputs.claude_code_version }}-${{ github.event.inputs.codex_version }}-${{ github.event.inputs.copilot_version }}-${{ github.event.inputs.pi_version }}
          restore-keys: |
            e2e-install-Windows-${{ matrix.harness }}-

      - name: Deterministic test gate
        if: matrix.harness != 'claude-code' || github.event.inputs.skip_claude_code != 'true'
        shell: wsl-bash {0}
        run: |
          source /tmp/wsl-env.sh
          set -o pipefail
          if ! go test -tags=e2e_fast -count=1 ./internal/e2e/ 2>&1 | tee /tmp/e2e-fast.txt; then
            echo "::error::deterministic (e2e_fast) test failure — a test defect, not infra; retries cannot clear it"
            {
              echo "## E2E deterministic gate FAILED (${{ matrix.harness }} / WSL2)"
              echo ""
              echo "Network-free tests failed against the resolved model/version env."
              echo "This is a test defect, not infra — the agent legs were not run."
              echo ""
              echo '```'
              grep -E '^( *--- FAIL|.*_test\.go:)' /tmp/e2e-fast.txt | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run e2e test
        id: run_e2e
        if: matrix.harness != 'claude-code' || github.event.inputs.skip_claude_code != 'true'
        shell: wsl-bash {0}
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          E2E_CACHE_DIR: ${{ runner.temp }}/e2e-install-cache
        run: |
          source /tmp/wsl-env.sh
          set -o pipefail
          max_attempts=3
          attempt=1
          while :; do
            echo "::group::e2e attempt $attempt/$max_attempts"
            if go test -tags=e2e -timeout=30m -v ./internal/e2e/ 2>&1 | tee /tmp/e2e-out.txt; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if grep -q '^panic: test timed out after' /tmp/e2e-out.txt; then
              hung=$(sed -n '/^panic: test timed out after/,/^$/p' /tmp/e2e-out.txt | head -20)
              echo "::error::go test hit its deadline — a hung test, not infra; retries cannot clear it"
              echo "test(s) still running at the deadline:"
              echo "$hung"
              {
                echo "## E2E deadline exceeded (${{ matrix.harness }} / WSL2)"
                echo '```'
                echo "$hung"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            bad=$(grep -oE 'FAIL \[[^]]+\]: (SANDBOX_FAIL|AGENT_REFUSED|AGENT_PARTIAL)' /tmp/e2e-out.txt | sort -u || true)
            if [ -n "$bad" ]; then
              echo "non-infra failure — not retrying:"
              echo "$bad"
              exit 1
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "max attempts ($max_attempts) reached — giving up"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "infra-only failure — retrying in 15s (attempt $attempt/$max_attempts)"
            sleep 15
          done

      - name: Skipped notice
        if: steps.run_e2e.outcome == 'skipped'
        shell: wsl-bash {0}
        run: |
          source /tmp/wsl-env.sh
          echo "## E2E (${{ matrix.harness }} / WSL2): SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          echo "skip_claude_code was set on this workflow_dispatch run (model would have been \`${{ steps.model.outputs.model }}\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Failure classification summary
        if: always() && steps.run_e2e.outcome != 'skipped'
        shell: wsl-bash {0}
        run: |
          source /tmp/wsl-env.sh
          echo "## E2E failure classification (${{ matrix.harness }} / WSL2)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Model: \`${{ steps.model.outputs.model }}\` · context: \`${{ steps.model.outputs.context }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ needs.model.outputs.fallback }}' = 'true' ] && [ '${{ matrix.harness }}' != 'claude-code' ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ Fallback model — the intended model is not served by the gateway, so this result does NOT certify it." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assertion | Mode | Reason |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'FAIL \[[^]]+\]: [A-Z_]+ — ' /tmp/e2e-out.txt; then
            grep -oE 'FAIL \[[^]]+\]: [A-Z_]+ — [^\\]*' /tmp/e2e-out.txt \
              | sort -u \
              | sed -E 's/FAIL \[([^]]+)\]: ([A-Z_]+) — (.*)/| `\1` | `\2` | \3 |/' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| _all passed_ | PASS | no failures |" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.harness }}-wsl2
          path: ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore
          retention-days: 14
